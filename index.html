<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusCare</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7ff;color:#202b45}
header{background:#263b80;color:white;padding:22px;text-align:center}
nav{background:#172554;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:8px}
section{background:white;margin:18px auto;padding:20px;max-width:850px;border-radius:12px}
h2{color:#263b80}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:6px}
button{background:#263b80;color:white;border:0;padding:12px 20px;border-radius:6px;cursor:pointer}
.complaint{border:1px solid #ccc;padding:12px;margin:12px 0;border-radius:8px}
</style>
</head>
<body>

<header>
<h1>🎓 CampusCare</h1>
<p>Campus Problem Solving System</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#report">Report Problem</a>
<a href="#track">Track Complaint</a>
<a href="#admin">Admin</a>
</nav>

<section id="home">
<h2>Welcome to CampusCare</h2>
<p>Report your college problems easily.</p>
<p>We help students report campus issues.</p>
</section>

<section id="report">
<h2>Report a Problem</h2>
<form id="complaintForm">
<label>Problem Category</label>
<select id="problemType" required>
<option value="">Select Category</option>
<option>Water Supply</option>
<option>Washroom</option>
<option>Electricity</option>
<option>Cleanliness</option>
<option>Classroom</option>
<option>Furniture</option>
<option>Other</option>
</select>
<label>Problem Location</label>
<input id="problemPlace" placeholder="Enter location" required>
<label>Problem Description</label>
<textarea id="problemDescription" placeholder="Describe your problem" required></textarea>
<button type="submit">Submit Complaint</button>
</form>
<p id="complaintMessage"></p>
<p id="complaintId"></p>
</section>

<section id="track">
<h2>Track Complaint</h2>
<input id="trackId" placeholder="Enter Complaint ID">
<button onclick="trackComplaint()">Track</button>
<p id="trackResult"></p>
</section>

<section id="admin">
<h2>Admin Dashboard</h2>
<button onclick="showComplaints()">View Complaints</button>
<div id="adminComplaints"></div>
</section>

<script>
function getComplaints(){
 return JSON.parse(localStorage.getItem("ccComplaints")||"[]");
}

document.getElementById("complaintForm").addEventListener("submit",function(e){
 e.preventDefault();

 const type=document.getElementById("problemType").value;
 const place=document.getElementById("problemPlace").value.trim();
 const description=document.getElementById("problemDescription").value.trim();

 const id="CC"+Date.now().toString().slice(-8);
 const complaints=getComplaints();

 complaints.push({
 id,type,place,description,
 status:"Pending",
 date:new Date().toLocaleString()
 });

 localStorage.setItem("ccComplaints",JSON.stringify(complaints));

 document.getElementById("complaintMessage").textContent="Complaint submitted successfully!";
 document.getElementById("complaintId").textContent="Complaint ID: "+id;
 this.reset();
});

function trackComplaint(){
 const id=document.getElementById("trackId").value.trim();
 const complaint=getComplaints().find(c=>c.id===id);

 document.getElementById("trackResult").textContent=
 complaint ? "Status: "+complaint.status+" | Problem: "+complaint.type : "Complaint not found.";
}

function showComplaints(){
 const area=document.getElementById("adminComplaints");
 area.replaceChildren();

 const complaints=getComplaints();

 if(complaints.length===0){
  area.textContent="No complaints found.";
  return;
 }

 complaints.forEach(c=>{
  const card=document.createElement("div");
  card.className="complaint";

  const details=document.createElement("p");
  details.textContent="ID: "+c.id+" | Category: "+c.type+" | Location: "+c.place+" | Description: "+c.description+" | Date: "+c.date;

  const status=document.createElement("select");
  ["Pending","In Progress","Solved"].forEach(s=>{
   const option=document.createElement("option");
   option.value=s;
   option.textContent=s;
   status.appendChild(option);
  });

  status.value=c.status;
  status.addEventListener("change",()=>{
   updateStatus(c.id,status.value);
  });

  card.append(details);
  card.append("Update Status: ");
  card.append(status);
  area.append(card);
 });
}

function updateStatus(id,newStatus){
 const complaints=getComplaints();
 const item=complaints.find(c=>c.id===id);
 if(item){
  item.status=newStatus;
  localStorage.setItem("ccComplaints",JSON.stringify(complaints));
 }
}
</script>
</body>
</html>
